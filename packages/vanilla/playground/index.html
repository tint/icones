<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>@icones/vanilla</title>
  </head>
  <body>
    <main>
      <h1>@icones/vanilla</h1>
      <p>声明式 HTML 图标，属性变化自动更新</p>

        id="icons"
        name="tabler:star"
        alt-name="tabler:heart"

    <script type="module" src="/src/index.ts"></script>
